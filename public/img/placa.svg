<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <!-- Ilustración del hero: placa con NFC + QR y un celular acercándose.
       El "QR" es decorativo: no es un código real ni se puede escanear. -->
  <defs>
    <path id="estrella" d="M0-10 2.35-3.24 9.51-3.09 3.8 1.24 5.88 8.09 0 4-5.88 8.09-3.8 1.24-9.51-3.09-2.35-3.24Z"/>
  </defs>

  <!-- Fondo -->
  <circle cx="180" cy="165" r="150" fill="#1FA2A6" opacity=".18"/>

  <!-- Placa -->
  <rect x="38" y="28" width="196" height="264" rx="26" fill="#FFFFFF"/>
  <rect x="38" y="28" width="196" height="264" rx="26" fill="none" stroke="#1FA2A6" stroke-width="4"/>

  <!-- Estrellas -->
  <g fill="#F2A541">
    <use href="#estrella" x="92" y="66"/>
    <use href="#estrella" x="114" y="66"/>
    <use href="#estrella" x="136" y="66"/>
    <use href="#estrella" x="158" y="66"/>
    <use href="#estrella" x="180" y="66"/>
  </g>

  <text x="136" y="104" text-anchor="middle" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#14213D">¡Dejanos tu reseña!</text>

  <!-- Ícono NFC -->
  <g fill="none" stroke="#14213D" stroke-width="4" stroke-linecap="round">
    <path d="M120 126a14 14 0 0 1 0 22"/>
    <path d="M130 120a24 24 0 0 1 0 34"/>
    <path d="M140 114a34 34 0 0 1 0 46"/>
  </g>
  <text x="160" y="143" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#14213D">NFC</text>

  <!-- QR decorativo (21 × 21 módulos de 4 px) -->
  <g transform="translate(94 176)">
    <rect width="84" height="84" fill="#FFFFFF"/>
    <g fill="#14213D">
      <rect width="28" height="28"/><rect x="56" width="28" height="28"/><rect y="56" width="28" height="28"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="4" y="4" width="20" height="20"/><rect x="60" y="4" width="20" height="20"/><rect x="4" y="60" width="20" height="20"/>
    </g>
    <g fill="#14213D">
      <rect x="8" y="8" width="12" height="12"/><rect x="64" y="8" width="12" height="12"/><rect x="8" y="64" width="12" height="12"/>
      <rect x="32" y="0" width="4" height="8"/><rect x="40" y="4" width="8" height="4"/><rect x="36" y="12" width="4" height="12"/>
      <rect x="44" y="16" width="8" height="4"/><rect x="0" y="32" width="12" height="4"/><rect x="16" y="36" width="8" height="4"/>
      <rect x="28" y="32" width="8" height="8"/><rect x="40" y="28" width="4" height="12"/><rect x="48" y="36" width="12" height="4"/>
      <rect x="64" y="32" width="4" height="12"/><rect x="72" y="36" width="12" height="4"/><rect x="4" y="44" width="4" height="8"/>
      <rect x="20" y="44" width="12" height="4"/><rect x="36" y="48" width="8" height="8"/><rect x="52" y="44" width="4" height="12"/>
      <rect x="60" y="52" width="8" height="4"/><rect x="76" y="48" width="8" height="8"/><rect x="32" y="60" width="4" height="12"/>
      <rect x="40" y="64" width="12" height="4"/><rect x="56" y="60" width="4" height="8"/><rect x="64" y="64" width="8" height="8"/>
      <rect x="36" y="76" width="8" height="8"/><rect x="52" y="72" width="8" height="4"/><rect x="76" y="68" width="4" height="16"/>
      <rect x="60" y="76" width="8" height="8"/>
    </g>
  </g>

  <!-- Ondas entre la placa y el celular -->
  <g fill="none" stroke="#F2A541" stroke-width="5" stroke-linecap="round">
    <path d="M246 132a20 20 0 0 1 0 30"/>
    <path d="M258 122a34 34 0 0 1 0 50"/>
  </g>

  <!-- Celular -->
  <g transform="rotate(-12 300 220)">
    <rect x="252" y="140" width="96" height="172" rx="18" fill="#14213D" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="262" y="158" width="76" height="132" rx="8" fill="#FFFFFF"/>
    <g fill="#F2A541">
      <use href="#estrella" x="300" y="196" transform="scale(1)"/>
    </g>
    <rect x="274" y="220" width="52" height="8" rx="4" fill="#1FA2A6"/>
    <rect x="280" y="236" width="40" height="8" rx="4" fill="#D5DAE3"/>
    <rect x="276" y="256" width="48" height="18" rx="9" fill="#E4572E"/>
  </g>
</svg>
